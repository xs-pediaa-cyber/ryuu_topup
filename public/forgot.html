<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Kata Sandi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(135deg, #ffe066, #ff6b6b);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Comic Neue', cursive;
        }

        .card {
            background: #fff;
            border: 4px solid #000;
            border-radius: 20px;
            box-shadow: 8px 8px 0px #000;
            max-width: 450px;
            width: 100%;
            padding: 2rem;
            transition: 0.3s;
        }

        .card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 12px 12px 0px #000;
        }

        .card-title {
            font-weight: 700;
            color: #000 !important;
            text-shadow: 2px 2px #ff6b6b;
        }

        .form-label {
            font-weight: 700;
            color: #000;
        }

        .form-control {
            border: 3px solid #000;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 3px 3px 0px #000;
        }

        .form-control:focus {
            border-color: #ff6b6b;
            box-shadow: 4px 4px 0px #000;
        }

        .btn {
            border: 3px solid #000;
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 4px 4px 0px #000;
            transition: 0.2s;
        }

        .btn:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        .btn-primary {
            background-color: #4dabf7;
            color: #000;
        }

        .btn-primary:hover {
            background-color: #339af0;
        }

        .btn-success {
            background-color: #51cf66;
            color: #000;
        }

        .btn-success:hover {
            background-color: #40c057;
        }

        .alert {
            border: 3px solid #000;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 3px 3px 0px #000;
        }

        .text-muted-small {
            font-size: 0.85rem;
            color: #333 !important;
        }

    </style>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card">
        <h2 class="card-title text-center mb-4 text-primary">Lupa Kata Sandi</h2>

        <div id="step1">
            <p class="text-center text-muted-small mb-4">Masukkan nomor telepon Anda untuk mendapatkan kode OTP.</p>
            <form id="requestOtpForm">
                <div class="mb-3">
                    <label for="nomorRequest" class="form-label">Nomor Telepon</label>
                    <input type="text" class="form-control" id="nomorRequest" placeholder="62xxxxxxxxxx" required>
                    <div class="form-text text-muted-small">Awali nomor dengan 62 (contoh: 628123456789)</div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2" id="sendOtpBtn">
                    <span id="sendOtpSpinner" class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true"></span>
                    Kirim Kode OTP
                </button>
                <div id="otpRequestMessage" class="mt-3 text-center"></div>
            </form>
        </div>

        <div id="step2" class="d-none">
            <p class="text-center text-muted-small mb-4">Masukkan kode OTP yang Anda terima dan kata sandi baru Anda.</p>
            <form id="resetPasswordForm">
                <input type="hidden" id="nomorReset">
                <div class="mb-3">
                    <label for="otpCode" class="form-label">Kode OTP</label>
                    <input type="text" class="form-control" id="otpCode" placeholder="Masukkan 6 digit OTP" required>
                    <div class="form-text text-muted-small" id="otpInstruction">Kode OTP telah dikirimkan ke nomor Anda.</div>
                    <div class="text-center mt-2">
                        <span id="otpTimer" class="text-muted-small">Minta OTP lagi dalam 30 detik</span>
                        <button type="button" class="btn btn-primary w-100 py-2 mt-2 d-none" id="resendOtpBtn">Ulang OTP</button>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label">Password Baru</label>
                    <input type="password" class="form-control" id="newPassword" required>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Konfirmasi Password Baru</label>
                    <input type="password" class="form-control" id="confirmPassword" required>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2" id="resetPassBtn">
                    <span id="resetPassSpinner" class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true"></span>
                    Reset Password
                </button>
                <div id="resetPasswordMessage" class="mt-3 text-center"></div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5L" crossorigin="anonymous"></script>

    <script>
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');

        const requestOtpForm = document.getElementById('requestOtpForm');
        const nomorRequest = document.getElementById('nomorRequest');
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const sendOtpSpinner = document.getElementById('sendOtpSpinner');
        const otpRequestMessage = document.getElementById('otpRequestMessage');
        const otpInstruction = document.getElementById('otpInstruction');
        const otpTimer = document.getElementById('otpTimer');
        const resendOtpBtn = document.getElementById('resendOtpBtn');
        let otpCountdown = null;

        const resetPasswordForm = document.getElementById('resetPasswordForm');
        const nomorReset = document.getElementById('nomorReset');
        const otpCode = document.getElementById('otpCode');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const resetPassBtn = document.getElementById('resetPassBtn');
        const resetPassSpinner = document.getElementById('resetPassSpinner');
        const resetPasswordMessage = document.getElementById('resetPasswordMessage');

        function showMessage(element, type, message) {
            element.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }

        function toggleLoading(button, spinner, isLoading) {
            if (isLoading) {
                spinner.classList.remove('d-none');
                button.setAttribute('disabled', 'true');
            } else {
                spinner.classList.add('d-none');
                button.removeAttribute('disabled');
            }
        }

        function startOtpCountdown() {
            clearInterval(otpCountdown);
            let seconds = 30;
            resendOtpBtn.classList.add('d-none');
            otpTimer.classList.remove('d-none');
            otpTimer.textContent = `Minta OTP lagi dalam ${seconds} detik`;

            otpCountdown = setInterval(() => {
                seconds--;
                if (seconds <= 0) {
                    clearInterval(otpCountdown);
                    otpTimer.classList.add('d-none');
                    resendOtpBtn.classList.remove('d-none');
                    return;
                }
                otpTimer.textContent = `Minta OTP lagi dalam ${seconds} detik`;
            }, 1000);
        }

        async function requestOtp(nomor, isResend = false) {
            if (!nomor) {
                showMessage(otpRequestMessage, 'danger', 'Nomor telepon harus diisi.');
                return false;
            }

            if (isResend) {
                resendOtpBtn.disabled = true;
            } else {
                toggleLoading(sendOtpBtn, sendOtpSpinner, true);
            }
            otpRequestMessage.innerHTML = '';

            try {
                const response = await fetch('/get/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nomor }),
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(otpRequestMessage, 'success', data.message || 'Kode OTP berhasil dikirim.');
                    nomorReset.value = nomor;
                    step1.classList.add('d-none');
                    step2.classList.remove('d-none');
                    otpInstruction.textContent = 'Kode OTP telah dikirimkan ke nomor Anda. Periksa pesan WhatsApp/SMS Anda.';
                    startOtpCountdown();
                    return true;
                } else {
                    showMessage(otpRequestMessage, 'danger', data.message || 'Gagal mengirim OTP.');
                    return false;
                }
            } catch (error) {
                showMessage(otpRequestMessage, 'danger', 'Terjadi kesalahan jaringan atau server.');
                return false;
            } finally {
                if (isResend) resendOtpBtn.disabled = false;
                else toggleLoading(sendOtpBtn, sendOtpSpinner, false);
            }
        }

        requestOtpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await requestOtp(nomorRequest.value.trim());
        });

        resendOtpBtn.addEventListener('click', async () => {
            const nomor = nomorReset.value.trim() || nomorRequest.value.trim();
            if (!nomor) return;

            await requestOtp(nomor, true);
        });


        resetPasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nomor = nomorReset.value.trim();
            const otp = otpCode.value.trim();
            const password = newPassword.value;
            const confirm = confirmPassword.value;

            if (!nomor || !otp || !password || !confirm) {
                showMessage(resetPasswordMessage, 'danger', 'Semua field harus diisi.');
                return;
            }

            if (password !== confirm) {
                showMessage(resetPasswordMessage, 'danger', 'Konfirmasi password tidak cocok.');
                return;
            }

            toggleLoading(resetPassBtn, resetPassSpinner, true);
            resetPasswordMessage.innerHTML = '';

            try {
                const response = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ nomor, otp, newPassword: password }),
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(resetPasswordMessage, 'success', data.message + ' Anda akan dialihkan ke halaman login...');
                    setTimeout(() => {
                         window.location.href = '/auth/login';
                    }, 3000);
                } else {
                    showMessage(resetPasswordMessage, 'danger', data.message);
                }
            } catch (error) {
                showMessage(resetPasswordMessage, 'danger', 'Terjadi kesalahan jaringan atau server.');
            } finally {
                toggleLoading(resetPassBtn, resetPassSpinner, false);
            }
        });
    </script>
</body>
</html>
