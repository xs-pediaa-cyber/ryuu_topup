
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>User Mutasi Tarik</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#f5f7fb;
font-family:system-ui,Segoe UI,Arial;
}

.card{
border-radius:14px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
border:none;
}

.badge-pending{background:#fff3cd;color:#856404}
.badge-success{background:#d4edda;color:#155724}
.badge-cancel{background:#f8d7da;color:#721c24}

.table thead{
background:#0d6efd;
color:white;
}

.search-box{
max-width:280px;
}
</style>
</head>

<body>

<div class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-3">
<h4 class="fw-bold">📊 User Mutasi Penarikan</h4>
<input class="form-control search-box" placeholder="Cari username..." id="search">
</div>

<div class="card">
<div class="card-body">

<table class="table table-hover align-middle">
<thead>
<tr>
<th>User</th>
<th>Nominal</th>
<th>Status</th>
<th>Tanggal</th>
</tr>
</thead>
<tbody id="data">
<tr><td colspan="4" class="text-center">Loading...</td></tr>
</tbody>
</table>

</div>
</div>

</div>

<script>
let raw=[];

async function load(){
 const r = await fetch('/admin/user-mutasi');
 raw = await r.json();
 render(raw);
}

function badge(s){
 if(s=='pending') return '<span class="badge badge-pending">Pending</span>';
 if(s=='success') return '<span class="badge badge-success">Success</span>';
 return '<span class="badge badge-cancel">Cancel</span>';
}

function render(arr){
 document.getElementById('data').innerHTML =
 arr.map(x=>`
 <tr>
 <td>${x.username}</td>
 <td class="fw-bold text-primary">Rp ${Number(x.nominal).toLocaleString()}</td>
 <td>${badge(x.status)}</td>
 <td>${x.created_at||'-'}</td>
 </tr>
 `).join('') || '<tr><td colspan=4 class=text-center>Data kosong</td></tr>';
}

document.getElementById('search').addEventListener('input',e=>{
 const v=e.target.value.toLowerCase();
 render(raw.filter(x=>x.username.toLowerCase().includes(v)));
});

load();
</script>

</body>
</html>
