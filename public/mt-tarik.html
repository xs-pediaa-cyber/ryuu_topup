
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MT Tarik - Riwayat Penarikan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background:#f6f7fb; }
    .card { border-radius: 14px; }
    .badge-status { font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .clickable { cursor:pointer; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
      <div>
        <h3 class="mb-0"><i class="bi bi-cash-coin me-2"></i>MT Tarik</h3>
        <div class="text-muted">Cek status penarikan & batalkan jika masih <span class="badge text-bg-warning">Pending</span>.</div>
      </div>
      <div class="d-flex gap-2">
        <a href="/tarik" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Ke Tarik</a>
        <button class="btn btn-primary" id="btnRefresh"><i class="bi bi-arrow-repeat me-1"></i>Refresh</button>
      </div>
    </div>

    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-4">
            <label class="form-label mb-1">Filter Status</label>
            <select class="form-select" id="filterStatus">
              <option value="">Semua</option>
              <option value="pending">Pending</option>
              <option value="success">Success</option>
              <option value="cancel">Cancel</option>
              <option value="failed">Failed</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label mb-1">Cari (ID / Tujuan / Metode)</label>
            <input type="text" class="form-control" id="searchInput" placeholder="contoh: WD-..., Dana, 08xx">
          </div>
          <div class="col-md-4">
            <label class="form-label mb-1">Info</label>
            <div class="alert alert-info py-2 mb-0">
              <small>
                <i class="bi bi-lightbulb me-1"></i>
                Tombol <b>Cek Status</b> & <b>Batalkan</b> mirip seperti di <b>mt-deposit</b>.
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="alertBox"></div>

    <div class="card shadow-sm">
      <div class="card-header bg-white d-flex align-items-center justify-content-between">
        <span><i class="bi bi-clock-history me-1"></i>Riwayat Penarikan</span>
        <small class="text-muted" id="countInfo">0 data</small>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Tanggal</th>
              <th>ID</th>
              <th>Metode</th>
              <th>Tujuan</th>
              <th class="text-end">Nominal</th>
              <th class="text-end">Fee</th>
              <th class="text-end">Total</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="8" class="text-center text-muted py-4">Memuat...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Fetch data from localStorage
    function getWithdrawalHistory() {
      const history = JSON.parse(localStorage.getItem('withdrawHistory')) || [];
      return history;
    }

    // Mocked data (for testing purposes)
    function render() {
      const tbody = document.getElementById('tbody');
      const filterStatus = document.getElementById('filterStatus').value;
      const searchInput = document.getElementById('searchInput').value.toLowerCase();

      let history = getWithdrawalHistory();

      // Apply filters
      if (filterStatus) {
        history = history.filter(item => item.status === filterStatus);
      }

      if (searchInput) {
        history = history.filter(item =>
          item.id.toLowerCase().includes(searchInput) || 
          item.metode.toLowerCase().includes(searchInput) || 
          item.tujuan.includes(searchInput)
        );
      }

      // Update count
      document.getElementById('countInfo').textContent = `${history.length} data`;

      // Render history data
      tbody.innerHTML = '';
      if (history.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-4">Tidak ada data.</td></tr>`;
        return;
      }

      history.forEach(item => {
        const row = document.createElement('tr');
        row.className = 'clickable';
        row.innerHTML = `
          <td>${new Date(item.created_at).toLocaleString()}</td>
          <td class="mono">${item.id}</td>
          <td>${item.metode}</td>
          <td class="mono">${item.tujuan}</td>
          <td class="text-end">Rp ${item.nominal.toLocaleString()}</td>
          <td class="text-end">Rp ${item.fee.toLocaleString()}</td>
          <td class="text-end">Rp ${(item.nominal + item.fee).toLocaleString()}</td>
          <td class="text-center"><span class="badge text-bg-${item.status === 'pending' ? 'warning' : item.status === 'success' ? 'success' : 'danger'}">${item.status}</span></td>
        `;
        tbody.appendChild(row);
      });
    }

    // Event Listeners for filter and search
    document.getElementById('filterStatus').addEventListener('change', render);
    document.getElementById('searchInput').addEventListener('input', render);

    // Initial render
    window.onload = render;
  </script>
</body>
</html>
