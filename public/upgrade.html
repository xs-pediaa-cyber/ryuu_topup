<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrade Sistem - Comic Style</title>
    <style>
        /* --- CSS TEMA KOMIK + FONT STANDAR --- */
        body {
            /* Menggunakan font standar yang tegas */
            font-family: Arial, Helvetica, sans-serif; 
            background-color: #e0f2f1; /* Hijau Muda */
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            /* Border tebal khas komik */
            border: 4px solid #333; 
            /* Shadow tebal khas komik */
            box-shadow: 8px 8px 0px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }

        h2 {
            text-align: center;
            color: #2e7d32; /* Hijau Tua */
            text-transform: uppercase;
            /* Efek shadow pada teks */
            text-shadow: 2px 2px 0px #ccc; 
            font-weight: 800;
        }

        .alert-box {
            background-color: #fff9c4;
            border: 2px dashed #fbc02d;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #1b5e20;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            /* Border tebal pada input */
            border: 3px solid #333;
            border-radius: 10px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 16px;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .btn-submit {
            background-color: #4caf50;
            color: white;
            /* Border tebal dan shadow pada tombol */
            border: 3px solid #333;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
        }

        .btn-submit:hover {
            background-color: #66bb6a;
        }

        /* Efek tombol ditekan */
        .btn-submit:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px rgba(0,0,0,0.2);
        }

        #resultArea {
            margin-top: 20px;
            padding: 15px;
            border: 2px solid #2e7d32;
            background-color: #e8f5e9;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Upgrade Sistem</h2>
    
    <div class="alert-box">
        <strong>⚠️ Penting:</strong> Setelah proses upgrade selesai, akses transaksi akan dialihkan sepenuhnya melalui API. Pastikan sistem Anda siap!
    </div>

    <form id="upgradeForm">
        <div class="form-group">
            <label>1. Penggunaan (Website, Bot Telegram, dll)</label>
            <input type="text" id="penggunaan" placeholder="Contoh: Website Toko Online" required>
        </div>

        <div class="form-group">
            <label>2. Url Website / No Bot</label>
            <input type="text" id="urlBot" placeholder="Contoh: https://tokoku.com" required>
        </div>

        <div class="form-group">
            <label>3. Deskripsi Sistem</label>
            <textarea id="deskripsi" placeholder="Jelaskan singkat (max 500 karakter)" maxlength="500" required></textarea>
        </div>

        <div class="form-group">
            <label>4. Catatan Tambahan</label>
            <textarea id="catatan" placeholder="Detail tambahan jika diperlukan"></textarea>
        </div>

        <button type="submit" class="btn-submit">Kirim Permintaan Upgrade</button>
    </form>

    <div id="resultArea">
        <h3>✅ Permintaan Terkirim!</h3>
        <p><strong>Data Anda:</strong></p>
        <p id="dataSummary"></p>
    </div>
</div>

<script>
    // --- KONFIGURASI BOT TELEGRAM ---
    // Ganti dengan token bot Anda
    const BOT_TOKEN = '7679348177:AAFymI3itCrCrhTDVX3pDp5tNwJV0jBsEQ4'; 
    // Ganti dengan ID user Anda
    const OWNER_ID = '7058216834'; 

    const form = document.getElementById('upgradeForm');
    const resultArea = document.getElementById('resultArea');
    const dataSummary = document.getElementById('dataSummary');

    // 1. Muat data dari localStorage saat halaman dimuat
    window.onload = function() {
        if (localStorage.getItem('upgradeData')) {
            const savedData = JSON.parse(localStorage.getItem('upgradeData'));
            document.getElementById('penggunaan').value = savedData.penggunaan;
            document.getElementById('urlBot').value = savedData.urlBot;
            document.getElementById('deskripsi').value = savedData.deskripsi;
            document.getElementById('catatan').value = savedData.catatan;
        }
    };

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Ambil nilai input
        const data = {
            penggunaan: document.getElementById('penggunaan').value,
            urlBot: document.getElementById('urlBot').value,
            deskripsi: document.getElementById('deskripsi').value,
            catatan: document.getElementById('catatan').value
        };

        // 2. Simpan data ke localStorage
        localStorage.setItem('upgradeData', JSON.stringify(data));

        // 3. Tampilkan detail di layar
        dataSummary.innerHTML = `
            <strong>Penggunaan:</strong> ${data.penggunaan}<br>
            <strong>URL/Bot:</strong> ${data.urlBot}<br>
            <strong>Deskripsi:</strong> ${data.deskripsi}<br>
            <strong>Catatan:</strong> ${data.catatan}
        `;
        resultArea.style.display = 'block';

        // 4. Kirim notifikasi ke Telegram
        sendToTelegram(data);
    });

    function sendToTelegram(data) {
        const text = `🚨 *Permintaan Upgrade Baru* 🚨\n\n` +
                     `*Penggunaan:* ${data.penggunaan}\n` +
                     `*URL/Bot:* ${data.urlBot}\n` +
                     `*Deskripsi:* ${data.deskripsi}\n` +
                     `*Catatan:* ${data.catatan}`;

        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        const params = {
            chat_id: OWNER_ID,
            text: text,
            parse_mode: 'Markdown'
        };

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(params),
        })
        .then(response => response.json())
        .then(result => {
            console.log('Notifikasi terkirim ke Telegram:', result);
            alert("Permintaan berhasil dikirim!");
        })
        .catch(error => {
            console.error('Error mengirim notifikasi:', error);
            alert("Gagal mengirim notifikasi ke Telegram.");
        });
    }
</script>

</body>
</html>
